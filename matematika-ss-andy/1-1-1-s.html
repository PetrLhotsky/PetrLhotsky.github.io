10px 14px}.sectionHeader{display:flex;justify-content:space-between;align-items:center;gap:15px;margin:28px 0 15px}h2{font-size:1.34rem;margin:0}.problem{padding:23px;margin-bottom:13px}.problemTop{display:flex;justify-content:space-between;gap:16px}.meta{display:flex;align-items:center;gap:9px;margin-bottom:9px}.num{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;font-weight:800;color:var(--muted)}.level{font-size:.73rem;background:#edf2fa;color:#4d617c;padding:3px 10px;border-radius:999px}.statement{font-size:1.08rem;line-height:1.75}.check{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;font-size:.83rem;color:var(--muted);cursor:pointer}.check input{accent-color:var(--green);height:18px;width:18px}.answer{display:none;background:var(--greenSoft);border:1px solid #caebda;border-radius:12px;padding:14px 16px;margin-top:18px}.answer.show{display:block}.procedure{border-top:1px solid #caebda;margin-top:12px;padding-top:12px}.procedure div:last-child{white-space:pre-line}.answerLabel{font-size:.76rem;font-weight:800;letter-spacing:.04em;color:var(--green);margin-bottom:4px}.problemFoot{display:flex;justify-content:flex-end;margin-top:16px}.reveal{background:white;border:1px solid var(--line);border-radius:9px;color:var(--primary);font-size:.87rem;font-weight:700;padding:9px 12px}.nav{display:flex;justify-content:space-between;margin-top:20px;gap:14px}.next{border:0;background:var(--primary);color:white;border-radius:10px;padding:10px 16px;font-weight:700}.nav button:disabled{opacity:.4;cursor:not-allowed}.note{border-top:1px solid var(--line);padding-top:23px;margin-top:35px}.note h2{margin-bottom:8px}.note p{margin:0}.completed{border-color:#bde7d2}@media(max-width:640px){.wrap{padding:25px 14px 50px}.panel{padding:17px}.filters{grid-template-columns:1fr}.segments{width:100%;display:grid;grid-template-columns:repeat(4,1fr)}.segments button{padding:10px 3px;font-size:.78rem}.problem{padding:17px}.check{font-size:0}.check input{width:21 <script>
const sections=[{"title": "Přirozená čísla", "questions": [["V knihovně je 245 detektivek, 178 románů a 96 encyklopedií. Kolik knih těchto tří druhů je dohromady?", "519 knih", "245 + 178 + 96 = 519."], ["Škola objednala 18 balení se 24 sešity. Mezi žáky rozdělila 305 sešitů. Kolik sešitů jí zbylo?", "127 sešitů", "18 × 24 = 432; 432 − 305 = 127."], ["Dvě autobusové linky vyjíždějí současně v 7:00. První jezdí každých 18 minut, druhá každých 24 minut. Kdy znovu odjedou společně?", "V 8:12", "NSN(18, 24) = 72 minut. 7:00 + 72 minut = 8:12."], ["Máme 84 modrých a 126 červených korálků. Chceme vytvořit co nejvíce stejných balíčků bez zbytku. Kolik balíčků vznikne a co bude v každém?", "42 balíčků; v každém 2 modré a 3 červené korálky", "NSD(84, 126) = 42. V každém balíčku bude 84 : 42 = 2 modrých a 126 : 42 = 3 červené korálky."], ["Na stadionu stojí 28 řad po 36 sedadlech. Organizátor prodal 875 vstupenek. Kolik sedadel zůstane volných?", "133 sedadel", "28 × 36 = 1008; 1008 − 875 = 133."], ["Tři světelné signály blikají každých 12, 15 a 20 sekund. Všechny blikly zároveň v 10:00:00. Kolikrát znovu bliknou současně do 10:10:00 včetně?", "10krát", "NSN(12, 15, 20) = 60 sekund. Další společná bliknutí nastanou každou minutu v časech 10:01 až 10:10, tedy 10krát."]]}, {"title": "Sudá a lichá čísla, prvočísla", "questions": [["Na školní turnaj přišlo 47 žáků. Mohou se všichni rozdělit do dvojic bez zbytku?", "Ne, jeden žák zbude.", "47 je liché číslo, při dělení dvěma je zbytek 1."], ["Organizátor má 53 cen. Chce je rozdělit do několika stejně velkých skupin, alespoň po dvou cenách, bez zbytku. Je to možné?", "Ne.", "53 je prvočíslo; jeho kladní dělitelé jsou jen 1 a 53."], ["Ve skladu je 90 lahví. Mají se rozdělit do krabic po 6, 9 nebo 15 kusech. Pro které velikosti to půjde bez zbytku?", "Pro všechny tři velikosti.", "90 : 6 = 15, 90 : 9 = 10, 90 : 15 = 6."], ["Dva po sobě jdoucí liché počty vstupenek dávají dohromady 84 vstupenek. Kolik vstupenek bylo prodáno v každé ze dvou pokladen?", "41 a 43 vstupenek", "Označ první liché číslo x, druhé x + 2. Pak 2x + 2 = 84, takže x = 41."], ["Dva po sobě jdoucí sudé počty žáků jsou dohromady 74. Urči oba počty.", "36 a 38 žáků", "x + (x + 2) = 74. Odtud x = 36 a x + 2 = 38."], ["Kód zámku tvoří dvojciferné prvočíslo. Jeho ciferný součet je 10 a je větší než 50. Najdi všechny možné kódy.", "73", "Dvojciferná čísla větší než 50 s ciferným součtem 10 jsou 55, 64, 73, 82 a 91. Prvočíslo je pouze 73."]]}, {"title": "Celá čísla", "questions": [["Ráno bylo −6 °C. Do poledne se oteplilo o 11 °C. Jaká byla polední teplota?", "5 °C", "−6 + 11 = 5."], ["Potápěč je 18 metrů pod hladinou a vystoupá o 7 metrů. V jaké hloubce je?", "11 metrů pod hladinou", "−18 + 7 = −11; hloubka je 11 m."], ["Na účtu je −850 Kč. Přijde platba 1 500 Kč a poté se strhne 920 Kč. Jaký je zůstatek?", "−270 Kč", "−850 + 1500 − 920 = −270."], ["Teplota v horské chatě klesla za tři noci vždy o 4 °C. Před prvním ochlazením byla 7 °C. Kolik bylo po třetí noci?", "−5 °C", "7 − 3 × 4 = −5."], ["Výtah začíná v podlaží −3, vyjede o 8 podlaží a pak sjede o 11 podlaží. Kde skončí?", "V podlaží −6", "−3 + 8 − 11 = −6."], ["Ve hře hráč v pěti kolech získal stejný počet bodů, ale ztratil 12 bodů za penalizaci. Konečný stav je −2 body. Kolik bodů získal v každém kole?", "2 body v každém kole", "5x − 12 = −2 → 5x = 10 → x = 2."]]}, {"title": "Racionální čísla", "questions": [["Z pizzy snědla Anna 1/4 a Petr 1/3. Jaká část pizzy zůstala?", "5/12 pizzy", "1 − 1/4 − 1/3 = 12/12 − 3/12 − 4/12 = 5/12."], ["Na zahradě zabírají 2/5 plochy záhony a 1/4 trávník. Jaká část je pro jiné využití?", "7/20 zahrady", "1 − 2/5 − 1/4 = 20/20 − 8/20 − 5/20 = 7/20."], ["Cyklista ujel dopoledne 3/8 plánované trasy a odpoledne 1/4 trasy. Jakou část musí ještě ujet?", "3/8 trasy", "1 − 3/8 − 1/4 = 1 − 3/8 − 2/8 = 3/8."], ["Nádrž byla naplněna do 3/4. Po spotřebování 2/5 původní kapacity nádrže v ní zůstalo 140 litrů. Jaká je kapacita nádrže?", "400 litrů", "Zůstalo 3/4 − 2/5 = 7/20 kapacity. (7/20)x = 140 → x = 400."], ["Z třídního fondu se vydala 1/3 na výlet a 1/4 zbývající částky na pomůcky. Kolik z původního fondu zůstalo?", "1/2 původní částky", "Po výletu zbývá 2/3; poté zůstávají 3/4 z 2/3. (2/3) × (3/4) = 1/2."], ["Tomáš přečetl první den 2/7 knihy, druhý den 1/3 knihy a třetí den zbylých 80 stran. Kolik stran má kniha?", "210 stran", "Zbývá 1 − 2/7 − 1/3 = 8/21 knihy. (8/21)x = 80 → x = 210."]]}, {"title": "Zlomky a desetinná čísla", "questions": [["Kilogram jablek stojí 38,40 Kč. Kolik zaplatíš za 2,5 kg?", "96 Kč", "38,40 × 2,5 = 96."], ["Běžec uběhl 0,375 závodu. Vyjádři tuto část zlomkem v základním tvaru.", "3/8 závodu", "0,375 = 375/1000 = 3/8."], ["Autobus projel 7/16 trasy dlouhé 80 km. Kolik kilometrů má za sebou?", "35 km", "80 × 7/16 = 35."], ["V obchodě zlevnili bundu o 12,5 % z původních 1 600 Kč. Jaká je nová cena?", "1 400 Kč", "12,5 % = 0,125 = 1/8. Sleva činí 1600/8 = 200 Kč. Cena je 1400 Kč."], ["Na 1 litr nápoje se použije 0,15 litru sirupu. Kolik litrů sirupu potřebuješ na 7,5 litru nápoje?", "1,125 litru", "7,5 × 0,15 = 1,125."], ["Za 3/5 kg sýra zaplatil zákazník 126 Kč. Jaká je cena za 1,25 kg stejného sýra?", "262,50 Kč", "Cena za 1 kg je 126 : (3/5) = 210 Kč. Za 1,25 kg: 210 × 1,25 = 262,50 Kč."]]}, {"title": "Iracionální čísla", "questions": [["Čtvercová zahrada má obsah 50 m². Urči délku její strany v přesném tvaru.", "5√2 m", "a² = 50 → a = √50 = 5√2 m."], ["Žebřík sahá 3 m vysoko a jeho patka je 2 m od zdi. Jak je dlouhý?", "√13 m (přibližně 3,61 m)", "Podle Pythagorovy věty: l = √(3² + 2²) = √13."], ["Čtvercová dlaždice má stranu 4 cm. Jak dlouhá je její úhlopříčka?", "4√2 cm", "d = √(4² + 4²) = √32 = 4√2."], ["Obdélníkové hřiště je dlouhé 7 m a široké 5 m. Kolik metrů měří úhlopříčka?", "√74 m (přibližně 8,60 m)", "d² = 7² + 5² = 74, tedy d = √74."], ["Dva čtvercové pozemky mají obsahy 18 m² a 8 m². O kolik je delší strana většího čtverce?", "√2 m", "√18 − √8 = 3√2 − 2√2 = √2."], ["Obdélník má strany √12 cm a √27 cm. Urči jeho obsah a rozhodni, zda je racionální.", "18 cm², racionální číslo", "S = √12 × √27 = √324 = 18 cm²."]]}, {"title": "Reálná čísla a číselná osa", "questions": [["Na číselné ose leží zastávky na souřadnicích −4 a 9. Jak daleko od sebe jsou?", "13 jednotek", "|9 − (−4)| = 13."], ["Dvě města leží na přímé silnici na pozicích 12 km a 38 km. Kde leží jejich střed?", "Na 25. kilometru", "(12 + 38) : 2 = 25."], ["Turista stojí na bodě −2,5 km vzhledem k rozcestníku. Jde 6,75 km kladným směrem. Kde skončí?", "Na souřadnici 4,25 km", "−2,5 + 6,75 = 4,25."], ["Body A a B leží na číselné ose na souřadnicích −√2 a 3√2. Urči jejich vzdálenost.", "4√2 jednotek", "|3√2 − (−√2)| = |4√2| = 4√2."], ["Na číselné ose má být bod stejně vzdálený od −7 a 13. Urči jeho souřadnici.", "3", "Střed je (−7 + 13) : 2 = 3."], ["Cena výrobku x v tisících Kč je větší než 2, ale zároveň její druhá mocnina je menší než 25. Jaký interval hodnot může mít x?", "x ∈ (2; 5)", "Z x² < 25 plyne −5 < x < 5. Spolu s x > 2 dostaneme 2 < x < 5."]]}, {"title": "Nekonečno", "questions": [["Hotel má pokoje očíslované všemi přirozenými čísly. Je možné určit pokoj s nejvyšším číslem?", "Ne.", "Ke každému číslu n existuje větší přirozené číslo n + 1."], ["Dvě sousední zastávky mají souřadnice 0 a 1 km. Kolik různých bodů mezi nimi leží na přímce?", "Nekonečně mnoho.", "Mezi dvěma různými reálnými čísly vždy existuje další reálné číslo, například jejich aritmetický průměr."], ["Robot urazí první minutu 1/2 m, druhou 1/4 m, třetí 1/8 m a tak dále. Jaké vzdálenosti se bude celkový součet blížit?", "1 metru", "Nekonečná geometrická řada 1/2 + 1/4 + 1/8 + … má součet 1."], ["Závodník uběhne postupně 1/2, pak 1/4 a potom 1/8 původní trati. Dosáhne po konečném počtu těchto postupně se zkracujících úseků celé trati?", "Ne, nikdy přesně celé trati.", "Po n úsecích uběhne 1 − (1/2)^n trati, což je pro každé konečné n menší než 1."], ["Na přímce jsou body očíslované 1, 2, 3, …; druhá řada obsahuje body 2, 4, 6, … . Která řada je početnější?", "Obě jsou stejně početné.", "Přiřazení n ↔ 2n spojuje každé přirozené číslo s právě jedním sudým číslem."], ["V nekonečné posloupnosti má n-tá úspora velikost 100/2ⁿ Kč (n = 1, 2, …). Jakou maximální celkovou úsporu lze takto získat?", "100 Kč (jako limita součtu).", "50 + 25 + 12,5 + … = 100. Žádný konečný počet členů přesně 100 Kč nedá."]]}, {"title": "Absolutní hodnota a intervaly", "questions": [["Teploměr ukazuje −8 °C a jiný 5 °C. Jaký je rozdíl teplot?", "13 °C", "|5 − (−8)| = 13."], ["Kurýr může dorazit maximálně 6 minut před nebo po 14:00. V jakém časovém intervalu může přijít?", "Od 13:54 do 14:06 včetně", "Časový rozdíl t od 14:00 splňuje |t| ≤ 6 minut."], ["Výrobek má mít hmotnost 500 g s povolenou odchylkou menší než 8 g. Jaký interval hmotností vyhovuje?", "(492; 508) g", "|m − 500| < 8 → −8 < m − 500 < 8 → 492 < m < 508."], ["Dvě laboratoře požadují teplotu A ∈ [18; 24] °C a B ∈ (20; 27) °C. Které teploty vyhoví oběma?", "(20; 24] °C", "Hledáme průnik obou intervalů: [18; 24] ∩ (20; 27) = (20; 24]."], ["Na cestě je zakázáno zastavit ve vzdálenosti menší než 3 km od bodu 5 km. Ve kterých úsecích silnice od 0 km dál je možné zastavit?", "[0; 2] ∪ [8; +∞) km", "Povolené body splňují |x − 5| ≥ 3, tedy x ≤ 2 nebo x ≥ 8. Vzhledem k x ≥ 0 dostaneme uvedené intervaly."], ["Při výrobě se požaduje |2x − 10| ≤ 3, kde x je rozměr v cm. Urči přípustný interval rozměrů.", "x ∈ [3,5; 6,5] cm", "−3 ≤ 2x − 10 ≤ 3 → 7 ≤ 2x ≤ 13 → 3,5 ≤ x ≤ 6,5."]]}];
const topic=document.getElementById('topic'),problems=document.getElementById('problems');
let state={done:{},shown:{},section:0,filter:'all'};
try{const saved=JSON.parse(localStorage.getItem('mathWordProblemsSS_v1'));if(saved&&typeof saved==='object'){state={...state,...saved};}}catch(e){}
if(!Number.isInteger(state.section)||state.section<0||state.section>=sections.length)state.section=0;
if(!['all','easy','mid','hard'].includes(state.filter))state.filter='all';
function save(){try{localStorage.setItem('mathWordProblemsSS_v1',JSON.stringify(state));}catch(e){}}
function totalDone(){return Object.values(state.done).filter(Boolean).length}
function stats(){const done=totalDone();document.getElementById('progressText').textContent=`${done} / 54 příkladů`;document.getElementById('percent').textContent=`${Math.round(done/54*100)} % hotovo`;document.getElementById('progressBar').style.width=`${done/54*100}%`;document.getElementById('progressTrack').setAttribute('aria-valuenow',done);document.getElementById('sectionCount').textContent=`${sections[state.section].questions.filter((_,i)=>state.done[`${state.section}-${i}`]).length} z 6 hotovo`}
function element(tag,cls,txt){let e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e;}
function render(){topic.value=String(state.section);const section=sections[state.section];document.getElementById('sectionName').textContent=section.title;document.querySelectorAll('[data-filter]').forEach(b=>{let active=b.dataset.filter===state.filter;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))});problems.replaceChildren();section.questions.forEach(([q,a,steps],i)=>{if(state.filter==='easy'&&i>1||state.filter==='mid'&&(i<2||i>3)||state.filter==='hard'&&i<4)return;const key=`${state.section}-${i}`;const card=element('article','problem'+(state.done[key]?' completed':''));const top=element('div','problemTop'),content=element('div',''),meta=element('div','meta');meta.append(element('span','num',`Příklad ${i+1}`),element('span','level',i<2?'Základní':i<4?'Střední':'Náročný'));let statement=element('div','statement');statement.textContent=q;content.append(meta,statement);let label=element('label','check'),check=document.createElement('input');check.type='checkbox';check.checked=!!state.done[key];check.setAttribute('aria-label',`Označit příklad ${i+1} jako hotový`);check.addEventListener('change',()=>{state.done[key]=check.checked;card.classList.toggle('completed',check.checked);stats();save()});label.append(check,document.createTextNode(' Hotovo'));top.append(content,label);const answer=element('div','answer'+(state.shown[key]?' show':''));answer.append(element('div','answerLabel','SPRÁVNÝ VÝSLEDEK'));const answerText=element('div','');answerText.textContent=a;answer.append(answerText);const procedure=element('div','procedure');procedure.append(element('div','answerLabel','POSTUP ŘEŠENÍ'));const procedureText=element('div','');procedureText.textContent=steps;procedure.append(procedureText);answer.append(procedure);const foot=element('div','problemFoot'),reveal=element('button','reveal',state.shown[key]?'Skrýt řešení':'Zobrazit řešení');reveal.type='button';reveal.setAttribute('aria-expanded',String(!!state.shown[key]));reveal.addEventListener('click',()=>{state.shown[key]=!state.shown[key];answer.classList.toggle('show',!!state.shown[key]);reveal.textContent=state.shown[key]?'Skrýt řešení':'Zobrazit řešení';reveal.setAttribute('aria-expanded',String(!!state.shown[key]));save();if(state.shown[key]&&window.MathJax?.typesetPromise)MathJax.typesetPromise([answer]).catch(()=>{})});foot.append(reveal);card.append(top,answer,foot);problems.append(card)});document.getElementById('prev').disabled=state.section===0;document.getElementById('next').disabled=state.section===sections.length-1;stats();save();if(window.MathJax?.typesetPromise)MathJax.typesetPromise([problems]).catch(()=>{});}
sections.forEach((s,i)=>{const opt=document.createElement('option');opt.value=String(i);opt.textContent=`${i+1}. ${s.title}`;topic.append(opt)});
topic.addEventListener('change',()=>{state.section=Number(topic.value);state.filter='all';render()});document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{state.filter=b.dataset.filter;render()}));document.getElementById('prev').addEventListener('click',()=>{if(state.section>0){state.section--;state.filter='all';render();}});document.getElementById('next').addEventListener('click',()=>{if(state.section<sections.length-1){state.section++;state.filter='all';render();}});document.getElementById('reset').addEventListener('click',()=>{if(confirm('Opravdu chceš smazat všechna označení hotových úloh a zobrazené výsledky?')){state.done={};state.shown={};render()}});
render();
window.addEventListener('load',()=>{if(window.MathJax?.typesetPromise)MathJax.typesetPromise([problems]).catch(()=>{});});
</script>
</body>
</html>
